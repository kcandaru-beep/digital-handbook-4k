<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Implementasi PKCIC</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0b2b4c, #1563a8);
    color: white;
    min-height: 100vh;
}

.container {
    max-width: 1400px;
    margin: auto;
    padding: 35px 50px 40px;
    text-align: center;
}

.logo {
    font-size: 48px;
    margin-bottom: 5px;
}

h1 {
    margin: 0;
    font-size: 52px;
    letter-spacing: 1px;
}

.subtitle {
    margin: 12px 0 45px;
    font-size: 24px;
    color: #d9e4ef;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.photo-card {
    background: white;
    border-radius: 20px;
    padding: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

.photo-card img {
    width: 100%;
    display: block;
    border-radius: 12px;
}

.back-btn {
    margin-top: 45px;
    padding: 18px 55px;
    background: transparent;
    color: white;
    border: 2px solid rgba(255,255,255,0.7);
    border-radius: 50px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.back-btn:hover {
    background: rgba(255,255,255,0.12);
}

@media (max-width: 900px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 700px) {

    .container {
        padding: 25px 20px;
    }

    h1 {
        font-size: 34px;
    }

    .subtitle {
        font-size: 19px;
    }

    .gallery {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">🏭</div>

    <h1>PKCIC</h1>

    <div class="subtitle">
        Dokumentasi Implementasi 4K+Shitsuke Area PKCIC
    </div>

    <div class="gallery">

        <div class="photo-card">
            <img src="pkcic1.jpg" alt="Implementasi PKCIC 1">
        </div>

        <div class="photo-card">
            <img src="pkcic2.jpg" alt="Implementasi PKCIC 2">
        </div>

        <div class="photo-card">
            <img src="pkcic3.jpg" alt="Implementasi PKCIC 3">
        </div>

        <div class="photo-card">
            <img src="pkcic4.jpg" alt="Implementasi PKCIC 4">
        </div>

        <div class="photo-card">
            <img src="pkcic5.jpg" alt="Implementasi PKCIC 5">
        </div>

        <div class="photo-card">
            <img src="pkcic6.jpg" alt="Implementasi PKCIC 6">
        </div>

    </div>

    <button class="back-btn"
        onclick="window.location.replace('implementasi.html')">
        ← KEMBALI KE IMPLEMENTASI
    </button>

</div>

</body>
</html>
