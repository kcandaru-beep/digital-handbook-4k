<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PKCIC - Implementasi 4K+Shitsuke</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #0b2b4c, #1563a8);
    color: white;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 1800px;
    margin: auto;
    padding: 30px 20px 40px;
    text-align: center;
}

.header {
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
    font-size: 38px;
}

.header p {
    margin: 10px 0 0;
    color: #d9e4ef;
    font-size: 18px;
    font-weight: bold;
}

.image-box {
    width: 100%;
    background: white;
    padding: 10px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.30);
}

.image-box img {
    display: block;
    width: 100%;
    height: auto;
    margin: auto;
    border-radius: 10px;
}

.back {
    display: inline-block;
    margin-top: 35px;
    padding: 14px 28px;
    border: 1px solid white;
    border-radius: 25px;
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
    transition: 0.3s;
}

.back:hover {
    background: white;
    color: #1563a8;
}

@media (max-width: 600px) {

    .container {
        padding: 20px 8px 30px;
    }

    .header h1 {
        font-size: 28px;
    }

    .header p {
        font-size: 15px;
    }

    .image-box {
        padding: 4px;
        border-radius: 10px;
    }

    .image-box img {
        border-radius: 6px;
    }
}

</style>

</head>

<div class="container">

    <div class="header">
        <h1>🏢 PKCIC</h1>
        <p>IMPLEMENTASI 4K + SHITSUKE</p>
    </div>

    <div class="image-box">
        <img 
            src="ChatGPT Image Aug 21, 2026, 10_07_49 AM(1).png"
            alt="Galeri Implementasi 4K+Shitsuke PKCIC">
    </div>

    <a href="implementasi.html" class="back">
        ← KEMBALI KE IMPLEMENTASI
    </a>

</div>

</body>
</html>
