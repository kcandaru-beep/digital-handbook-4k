<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PKCIC - Implementasi 4K+Shitsuke</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0b2b4c, #1563a8);
    color: white;
    min-height: 100vh;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px 20px 40px;
    text-align: center;
}

.header {
    margin-bottom: 30px;
}

.header h1 {
    margin: 0;
    font-size: 38px;
}

.header p {
    margin: 10px 0 0;
    color: #d9e4ef;
    font-size: 18px;
}

.image-box {
    background: white;
    padding: 15px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.30);
}

.image-box img {
    display: block;
    width: 100%;
    height: auto;
    max-width: 1100px;
    margin: auto;
    border-radius: 12px;
}

.back {
    display: block;
    width: fit-content;
    margin: 35px auto 0;
    padding: 14px 28px;
    border: 1px solid white;
    border-radius: 25px;
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
}

.back:hover {
    background: white;
    color: #1563a8;
}

@media (max-width: 600px) {

    .container {
        padding: 25px 15px 35px;
    }

    .header h1 {
        font-size: 30px;
    }

    .header p {
        font-size: 16px;
    }

    .image-box {
        padding: 8px;
        border-radius: 12px;
    }

    .image-box img {
        border-radius: 8px;
    }
}
</style>

</head>

<body>

<div class="container">

    <div class="header">
        <h1>🏢 PKCIC</h1>
        <p>IMPLEMENTASI 4K+SHITSUKE</p>
    </div>

    <div class="image-box">

        <img src="pkcic.jpg" alt="Implementasi PKCIC">

    </div>

    <a href="implementasi.html" class="back">
        ← KEMBALI KE IMPLEMENTASI
    </a>

</div>

</body>
</html>
