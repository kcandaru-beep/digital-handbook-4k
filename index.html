<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Implementasi 4K+Shitsuke</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0b2b4c, #1563a8);
    color: white;
    min-height: 100vh;
}

.container {
    max-width: 1400px;
    margin: auto;
    padding: 35px 50px 40px;
    text-align: center;
}

/* HEADER */

.logo {
    font-size: 48px;
    margin-bottom: 5px;
}

h1 {
    margin: 0;
    font-size: 52px;
    letter-spacing: 1px;
}

.subtitle {
    margin: 12px 0 55px;
    font-size: 26px;
    color: #d9e4ef;
}


/* MENU IMPLEMENTASI */

.menu {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 30px;
}

.card {
    background: #ffffff;
    color: #294b6b;
    text-decoration: none;
    min-height: 270px;
    padding: 45px 25px;
    border-radius: 25px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-8px);
    background: #f2f6fa;
}

.icon {
    font-size: 60px;
    margin-bottom: 20px;
}

.card h2 {
    margin: 0 0 15px;
    font-size: 32px;
    letter-spacing: 1px;
}

.card p {
    margin: 0;
    font-size: 20px;
    color: #5c6670;
}


/* TOMBOL KEMBALI */

.back {
    display: inline-block;
    margin-top: 45px;

    padding: 18px 45px;

    color: white;
    text-decoration: none;

    font-size: 20px;
    font-weight: bold;

    border: 2px solid rgba(255,255,255,0.7);
    border-radius: 50px;

    transition: 0.3s;
}

.back:hover {
    background: white;
    color: #17466f;
}


/* RESPONSIVE HP */

@media (max-width: 700px) {

    .container {
        padding: 25px 20px;
    }

    h1 {
        font-size: 34px;
    }

    .subtitle {
        font-size: 19px;
        margin-bottom: 35px;
    }

    .menu {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .card {
        min-height: 210px;
        padding: 30px 20px;
    }

    .card h2 {
        font-size: 25px;
    }

    .back {
        margin-top: 35px;
        font-size: 17px;
        padding: 15px 30px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">🏭</div>

    <h1>IMPLEMENTASI 4K</h1>

    <div class="subtitle">
        Dokumentasi Implementasi 4K+Shitsuke
    </div>


    <div class="menu">

        <a href="pkcic.html" class="card">

            <div class="icon">🏭</div>

            <h2>PKCIC</h2>

            <p>
                Dokumentasi implementasi area PKCIC
            </p>

        </a>


        <a href="pknci.html" class="card">

            <div class="icon">🏭</div>

            <h2>PKNCI</h2>

            <p>
                Dokumentasi implementasi area PKNCI
            </p>

        </a>

    </div>


    <!-- LANGSUNG KEMBALI KE INDEX -->

    <a href="index.html" class="back">
        ← KEMBALI KE HALAMAN UTAMA
    </a>

</div>

</body>
</html>
