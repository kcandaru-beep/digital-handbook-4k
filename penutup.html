<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kunci Sukses 4K + Shitsuke</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #102d4b;
}

/* CONTAINER HALAMAN */

.penutup-page {
    width: 100%;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;

    background: #102d4b;
}

/* GAMBAR UTAMA */

.penutup-image {
    width: 100%;
    max-width: 1200px;
    height: auto;

    display: block;

    margin: 0 auto;

    object-fit: contain;

    background: white;
}

/* AREA TOMBOL */

.navigation {
    width: 100%;
    padding: 25px 15px 35px;

    display: flex;
    justify-content: center;

    background: #102d4b;
}

/* TOMBOL KEMBALI */

.back-button {

    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 14px 32px;

    border: 1px solid #dce7f0;
    border-radius: 30px;

    color: #ffffff;

    background: transparent;

    text-decoration: none;

    font-size: 16px;
    font-weight: bold;

    transition: 0.25s ease;
}

.back-button:hover {

    background: #ffffff;

    color: #173d63;

    transform: translateY(-2px);
}


/* RESPONSIVE HP */

@media screen and (max-width: 768px) {

    .penutup-image {
        width: 100%;
        max-width: 100%;
    }

    .navigation {
        padding: 20px 15px 30px;
    }

    .back-button {
        width: 100%;
        max-width: 320px;

        padding: 14px 20px;

        font-size: 15px;
    }

}

</style>

</head>

<body>

<div class="penutup-page">

    <!--
    GAMBAR MASTER PENUTUP
    Pastikan file penutup.png
    berada satu folder dengan penutup.html
    -->

    <img
        src="penutup.png"
        alt="Kunci Sukses 4K + Shitsuke"
        class="penutup-image"
    >


    <!-- TOMBOL KEMBALI -->

    <div class="navigation">

        <a href="implementasi.html" class="back-button">

            ← KEMBALI KE IMPLEMENTASI

        </a>

    </div>

</div>

</body>
</html>
