<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kunci Sukses 4K + Shitsuke</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #0b2b4c, #1563a8);
    min-height: 100vh;
}

/* CONTAINER UTAMA */

.container {
    width: 100%;
    max-width: 1400px;
    margin: auto;
    padding: 30px 20px 40px;
}

/* GAMBAR PENUTUP */

.image-box {
    width: 100%;
    background: white;
    padding: 10px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.30);
}

.image-box img {
    display: block;
    width: 100%;
    height: auto;
    margin: auto;
    border-radius: 10px;
}

/* TOMBOL KEMBALI */

.back-wrap {
    text-align: center;
    margin-top: 35px;
}

.back {
    display: inline-block;
    padding: 14px 28px;
    border: 1px solid white;
    border-radius: 25px;
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
    transition: 0.3s;
}

.back:hover {
    background: white;
    color: #1563a8;
}

/* RESPONSIVE HP */

@media (max-width: 600px) {

    .container {
        padding: 20px 8px 30px;
    }

    .image-box {
        padding: 4px;
        border-radius: 10px;
    }

    .image-box img {
        border-radius: 6px;
    }

    .back {
        font-size: 14px;
        padding: 12px 24px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="image-box">

        <img
            src="ChatGPT Image Aug 21, 2026, 07_08_28 PM.png"
            alt="Kunci Sukses 4K + Shitsuke">

    </div>

    <div class="back-wrap">

        <a href="implementasi.html" class="back">
            ← KEMBALI KE IMPLEMENTASI
        </a>

    </div>

</div>

</body>
</html>
