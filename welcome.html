<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Handbook 4K</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0b2b4c, #1563a8);
  color: white;
  min-height: 100vh;
}

.header {
  text-align: center;
  padding: 35px 20px 20px;
}

.header h1 {
  margin: 0;
  font-size: 36px;
}

.header p {
  margin-top: 10px;
  color: #d9e4ef;
  font-size: 18px;
}

.menu {
  max-width: 900px;
  margin: auto;
  padding: 30px 20px 60px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

.card {
  background: white;
  color: #17466f;
  padding: 30px 25px;
  border-radius: 15px;
  text-decoration: none;
  text-align: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

.icon {
  font-size: 42px;
  margin-bottom: 12px;
}

.card h2 {
  margin: 5px 0 10px;
  font-size: 22px;
}

.card p {
  margin: 0;
  color: #666;
  font-size: 14px;
}

.back {
  display: block;
  width: fit-content;
  margin: 0 auto 40px;
  padding: 12px 25px;
  border: 1px solid white;
  border-radius: 25px;
  color: white;
  text-decoration: none;
}

@media (max-width: 600px) {
  .menu {
    grid-template-columns: 1fr;
  }

  .header h1 {
    font-size: 28px;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>📘 DIGITAL HANDBOOK 4K</h1>
  <p>SHITSUKE • Team Logistic Karawang</p>
</div>

<div class="menu">

  <a href="#" class="card">
    <div class="icon">📖</div>
    <h2>HAND BOOK 4K</h2>
    <p>Informasi dan panduan utama</p>
  </a>

  <a href="#" class="card">
    <div class="icon">📋</div>
    <h2>STANDARISASI</h2>
    <p>Standard kerja dan aturan</p>
  </a>

  <a href="#" class="card">
    <div class="icon">🎯</div>
    <h2>KAIZEN</h2>
    <p>Continuous Improvement</p>
  </a>

  <a href="#" class="card">
    <div class="icon">📊</div>
    <h2>VISUAL MANAGEMENT</h2>
    <p>Informasi visual area kerja</p>
  </a>

</div>

<a href="index.html" class="back">← KEMBALI KE HALAMAN UTAMA</a>

</body>
</html>
