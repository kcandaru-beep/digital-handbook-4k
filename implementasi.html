<title>Implementasi 4K+Shitsuke</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0b2b4c, #1563a8);
    color: white;
}

.header {
    text-align: center;
    padding: 40px 20px 25px;
}

.header h1 {
    margin: 0;
    font-size: 36px;
}

.header p {
    margin: 12px 0 0;
    color: #d9e4ef;
    font-size: 17px;
}

.content {
    max-width: 950px;
    margin: auto;
    padding: 20px;
}

.intro {
    background: white;
    color: #16324f;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 25px;

}

.menu {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;

.card {
    display: block;
    background: white;
    color: #16324f;
    padding: 35px 25px;
    border-radius: 15px;
    text-align: center;
    text-decoration: none;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-5px);
}

.icon {
    font-size: 55px;
    margin-bottom: 15px;
}

.card h2 {
    margin: 0 0 10px;
    color: #1563a8;
}

.card p {
    margin: 0;
    color: #555;
}

.back {
    display: block;
    width: fit-content;
    margin: 35px auto 40px;
    padding: 14px 28px;
    border: 1px solid white;
    border-radius: 25px;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.back:hover {
    background: white;
    color: #1563a8;
}

@media (max-width: 600px) {
    .header h1 {
        font-size: 28px;
    }

    .menu {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
