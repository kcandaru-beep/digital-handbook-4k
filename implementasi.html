<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Implementasi 4K - Digital Handbook</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0b2b4c, #1563a8);
    color: white;
    min-height: 100vh;
}

.container {
    max-width: 1400px;
    margin: auto;
    padding: 35px 50px 40px;
    text-align: center;
}

.logo {
    font-size: 48px;
    margin-bottom: 5px;
}

h1 {
    margin: 0;
    font-size: 52px;
    letter-spacing: 1px;
}

.subtitle {
    margin: 12px 0 55px;
    font-size: 26px;
    color: #d9e4ef;
}

.menu {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 30px;
}

.card {
    background: white;
    color: #294b6b;
    text-decoration: none;
    min-height: 270px;
    padding: 30px 25px;
    border-radius: 25px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    transition: 0.3s;
    overflow: hidden;
}

.card:hover {
    transform: translateY(-8px);
    background: #f2f6fa;
}

.card-image {
    width: 100%;
    height: 160px;
    object-fit: contain;
    margin-bottom: 15px;
}

.card h2 {
    margin: 5px 0 15px;
    font-size: 32px;
    letter-spacing: 1px;
}

.card p {
    margin: 0;
    font-size: 20px;
    color: #5c6670;
}

.back {
    display: block;
    width: fit-content;
    margin: 60px auto 0;
    padding: 16px 55px;
    border: 2px solid rgba(255,255,255,0.7);
    border-radius: 35px;
    color: white;
    text-decoration: none;
    font-size: 24px;
    font-weight: bold;
    transition: 0.3s;
}

.back:hover {
    background: white;
    color: #1563a8;
}

@media (max-width: 700px) {

    .container {
        padding: 25px 20px;
    }

    h1 {
        font-size: 34px;
    }

    .subtitle {
        font-size: 19px;
        margin-bottom: 35px;
    }

    .menu {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .card {
        min-height: 230px;
    }

    .card h2 {
        font-size: 28px;
    }

    .card-image {
        height: 130px;
    }

    .back {
        font-size: 18px;
        padding: 14px 30px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="logo">🏭</div>

    <h1>IMPLEMENTASI 4K</h1>

    <div class="subtitle">
        Dokumentasi Implementasi 4K+Shitsuke
    </div>


    <div class="menu">

        <a href="pkcic.html" class="card">

            <img
                src="https://kcandaru-beep.github.io/digital-handbook-4k/PKCIC.png"
                class="card-image"
                alt="PKCIC"
                onerror="this.style.display='none'">

            <h2>PKCIC</h2>

            <p>
                Dokumentasi implementasi area PKCIC
            </p>

        </a>


        <a href="pknci.html" class="card">

            <img
                src="https://kcandaru-beep.github.io/digital-handbook-4k/PKNCI.png"
                class="card-image"
                alt="PKNCI"
                onerror="this.style.display='none'">

            <h2>PKNCI</h2>

            <p>
                Dokumentasi implementasi area PKNCI
            </p>

        </a>

    </div>


    <a href="index.html" class="back">
        ← KEMBALI KE HALAMAN UTAMA
    </a>

</div>

</body>
</html>
